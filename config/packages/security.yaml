security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                success_handler: App\Security\LoginSuccessHandler
            custom_authenticators:
                - App\Security\TokenLoginAuthenticator
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            logout:
                path: app_logout
                target: /
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /
            switch_user:
                role: ROLE_SUPER_ADMIN
                parameter: _switch_user

    role_hierarchy:
        ROLE_ADMIN_CITY: ROLE_USER
        ROLE_SUPER_ADMIN: [ROLE_ADMIN_CITY, ROLE_ALLOWED_TO_SWITCH]

    access_control:
        - { path: ^/admin, roles: ROLE_SUPER_ADMIN }
        - { path: ^/([^/]+)/admin, roles: ROLE_ADMIN_CITY }
        - { path: ^/([^/]+)/mon-challenge, roles: ROLE_USER }
        - { path: ^/([^/]+)/saisie-trajets, roles: ROLE_USER }
        - { path: ^/([^/]+)/defis-photo, roles: ROLE_USER }
        - { path: ^/([^/]+)/profil, roles: ROLE_USER }
        # Team routes stay reachable anonymously (public team viewing) — write actions
        # (create/edit/join/leave) are guarded individually with #[IsGranted('ROLE_USER')]
        # on TeamController, since only some of the /equipes/* paths must require auth.

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
