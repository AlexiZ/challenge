
services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: frankenphp_prod
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - .:/var/www/html
      - ${HOME}/.ssh:${HOME}/.ssh
      # Deployer résout `~/.ssh/...` (ControlPath du multiplexage SSH) via l'utilisateur
      # réel du conteneur (root), pas via $HOME ni les chemins absolus de deploy_secrets.php.
      - ${HOME}/.ssh:/root/.ssh
      # Nécessaire pour le ForwardAgent de deploy.php : sans le socket de l'agent hôte,
      # le serveur distant n'a aucune clé à présenter à GitHub pour "git clone".
      - ${SSH_AUTH_SOCK}:${SSH_AUTH_SOCK}
    environment:
      SSH_AUTH_SOCK: ${SSH_AUTH_SOCK}
    depends_on:
      database:
        condition: service_healthy

###> doctrine/doctrine-bundle ###
  database:
    image: mysql:${MYSQL_VERSION:-8.4}
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
      # You should definitely change the password in production
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-!ChangeMe!}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-!ChangeMe!}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-!ChangeMe!}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - mysql_data:/var/lib/mysql:rw
      # Autorise l'utilisateur applicatif à créer la base de test (suffixe _test de doctrine.yaml).
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
###< doctrine/doctrine-bundle ###

  adminer:
    image: adminer
    ports:
      - "8081:8080"
    depends_on:
      - database

volumes:
  caddy_data:
  caddy_config:
###> doctrine/doctrine-bundle ###
  mysql_data:
###< doctrine/doctrine-bundle ###
